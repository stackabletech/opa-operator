---
dimensions:
  - name: opa
    values:
      # To use a custom image, add a comma and the full name after the product version
      # 0.67.1,oci.stackable.tech/sdp/opa:0.67.1-stackable0.0.0-dev
      - 1.12.3
      - 1.16.2
  - name: opa-latest
    values:
      # To use a custom image, add a comma and the full name after the product version
      # 0.67.1,oci.stackable.tech/sdp/opa:0.67.1-stackable0.0.0-dev
      - 1.16.2
  - name: trino-latest
    values:
      # To use a custom image, add a comma and the full name after the product version
      # 481,oci.stackable.tech/sdp/trino:481-stackable0.0.0-dev
      - "481"
  - name: kafka-latest
    values:
      # To use a custom image, add a comma and the full name after the product version
      # 4.2.1,oci.stackable.tech/sdp/kafka:4.2.1-stackable0.0.0-dev
      - "4.2.1"
  - name: superset-latest
    values:
      # To use a custom image, add a comma and the full name after the product version
      # 6.1.0,oci.stackable.tech/sdp/superset:6.1.0-stackable0.0.0-dev
      - "6.1.0"
  - name: keycloak
    values:
      - 23.0.1
  - name: data-hub
    values:
      - 1.0.3
  - name: data-hub-prerequisites
    values:
      - 0.3.0
  - name: openshift
    values:
      - "false"
  - name: use-tls
    values:
      - "true"
      - "false"
tests:
  - name: smoke
    dimensions:
      - opa
      - openshift
      - use-tls
  - name: resources
    dimensions:
      - opa-latest
      - openshift
  - name: logging
    dimensions:
      - opa
      - openshift
  - name: cluster-operation
    dimensions:
      - opa-latest
      - openshift
  - name: config-overrides
    dimensions:
      - opa-latest
      - openshift
  - name: keycloak-user-info
    dimensions:
      - opa-latest
      - keycloak
      - openshift
  # AD must be initialized (by running ad-init) first,
  # and the correct users and groups must be set up (see test-regorule.py)
  # name: ad-user-info
  #   dimensions:
  #     - opa-latest
  #     - openshift
  - name: aas-user-info
    dimensions:
      - opa-latest
      - openshift
  - name: openldap-user-info
    dimensions:
      - opa-latest
      - openshift
  - name: data-hub-resource-info
    dimensions:
      - opa-latest
      - trino-latest
      - kafka-latest
      - superset-latest
      - data-hub
      - data-hub-prerequisites
      - openshift
suites:
  - name: nightly
    patch:
      - dimensions:
          - expr: last
  - name: smoke-latest
    select:
      - smoke
    patch:
      - dimensions:
          - expr: last
  - name: openshift
    patch:
      - dimensions:
          - expr: last
      - dimensions:
          - name: openshift
            expr: "true"
