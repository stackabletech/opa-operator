---
# Ingestion recipe: DataHub's built-in bootstrap "demo-data" (datasets, dashboards, tags,
# users, glossary terms). The token is injected from the environment at run time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: datahub-sample-data-recipe
data:
  recipe.yml: |
    source:
      type: demo-data
      config: {}
    sink:
      type: datahub-rest
      config:
        server: "http://datahub-datahub-gms:8080"
        token: "${DATAHUB_GMS_TOKEN}"
---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 900
commands:
  # 1) Mint a DataHub Personal Access Token (PAT).
  #    GMS has metadata_service_authentication enabled, so we authenticate to the frontend
  #    with the default bootstrap user (datahub/datahub) to get a session, then call the
  #    createAccessToken GraphQL mutation. Run inside a throwaway pod because the frontend
  #    Service is only reachable in-cluster.
  - script: |
      set -euo pipefail

      # The frontend Deployment reports "available" before GMS finishes bootstrapping the default
      # policies that authorize the root user to mint tokens, so early attempts come back empty.
      # Retry until a token appears and emit it on a marker line for reliable capture.
      kubectl -n "$NAMESPACE" run pat-minter --restart=Never \
        --image=oci.stackable.tech/sdp/testing-tools:0.3.0-stackable0.0.0-dev \
        --command -- bash -ceu '
          FE="http://datahub-datahub-frontend:9002"
          for i in $(seq 1 60); do
            curl -s -c /tmp/cookies.txt -X POST "$FE/logIn" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"datahub\",\"password\":\"datahub\"}" >/dev/null || true
            resp="$(curl -s -b /tmp/cookies.txt -X POST "$FE/api/v2/graphql" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"mutation {createAccessToken(input:{type:PERSONAL,actorUrn:\\\"urn:li:corpuser:datahub\\\",duration:ONE_DAY,name:\\\"resource-info-fetcher-test\\\"}){accessToken}}\"}" || true)"
            token="$(echo "$resp" | jq -r ".data.createAccessToken.accessToken // empty" 2>/dev/null || true)"
            if [ -n "$token" ]; then echo "PAT_TOKEN:$token"; exit 0; fi
            echo "attempt $i: DataHub not ready to mint a PAT yet: $resp" >&2
            sleep 5
          done
          echo "gave up waiting for DataHub to mint a PAT" >&2
          exit 1
        '
      kubectl -n "$NAMESPACE" wait --for=jsonpath='{.status.phase}'=Succeeded pod/pat-minter --timeout=360s || true
      TOKEN="$(kubectl -n "$NAMESPACE" logs pat-minter | sed -n 's/^PAT_TOKEN://p' | tail -n 1)"
      if [ -z "$TOKEN" ]; then
        echo "Failed to mint a DataHub PAT; pat-minter logs:" >&2
        kubectl -n "$NAMESPACE" logs pat-minter >&2 || true
        kubectl -n "$NAMESPACE" delete pod pat-minter --ignore-not-found
        exit 1
      fi
      kubectl -n "$NAMESPACE" delete pod pat-minter --ignore-not-found

      # 2) Store the PAT as the Secret the resource-info-fetcher (OPA sidecar) will read.
      #    A PAT is a single bearer token -> single `token` key (NOT clientId/clientSecret).
      kubectl -n "$NAMESPACE" create secret generic datahub-rif-credentials \
        --from-literal=token="$TOKEN"

      # 3) Load the built-in sample data, authenticated with the same PAT.
      kubectl -n "$NAMESPACE" delete job sample-data-ingest --ignore-not-found
      kubectl -n "$NAMESPACE" apply -f - <<EOF
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: sample-data-ingest
      spec:
        backoffLimit: 1
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: ingest
                # Matches DataHub app version v1.6.0 (datahub chart 1.0.3).
                image: acryldata/datahub-ingestion:v1.6.0
                command: ["datahub", "ingest", "-c", "/recipe/recipe.yml"]
                env:
                  - name: DATAHUB_GMS_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: datahub-rif-credentials
                        key: token
                volumeMounts:
                  - name: recipe
                    mountPath: /recipe
            volumes:
              - name: recipe
                configMap:
                  name: datahub-sample-data-recipe
      EOF
