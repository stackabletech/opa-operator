---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 610
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available kafkaclusters.kafka.stackable.tech/test-kafka --timeout=600s
  # The seed Job (kafka-seed) creates the test topics; wait for it so the ingestion (32) has data.
  - script: kubectl -n $NAMESPACE wait --for=condition=complete job/kafka-seed --timeout=300s
