---
# Operator ClusterRole: bound (via ClusterRoleBinding) to the operator's own ServiceAccount.
# Grants permissions needed by the controller to reconcile OpaCluster resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opa-operator.fullname" . }}-clusterrole
  labels:
  {{- include "opa-operator.labels" . | nindent 4 }}
rules:
  # For automatic cluster domain detection
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    verbs:
      - get
  # Manage core workload resources created per OpaCluster (the ServiceAccount provides
  # workload pod identity). All resources are applied via Server-Side Apply
  # (create + patch), tracked for orphan cleanup (list + delete) and watched by the
  # controller.
  - apiGroups:
      - ""
    resources:
      - configmaps
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # RoleBinding created per OpaCluster to bind the product ClusterRole to the workload
  # ServiceAccount. Applied via SSA and tracked for orphan cleanup and watched by the
  # controller.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # Required to bind the product ClusterRole to the per-cluster ServiceAccount.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
    resourceNames:
      - {{ include "opa-operator.name" . }}-clusterrole
  # DaemonSet or Deployment created per role group, depending on the role's `workloadKind`.
  # Applied via SSA, tracked for orphan cleanup, and owned by the controller.
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # PodDisruptionBudget created per role, when the role has it enabled. Also needs `delete`, because
  # disabling it (or switching to a DaemonSet) must clean the existing budget up.
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # Required for maintaining the CRDs within the operator (including the conversion webhook info).
  # Also for the startup condition check before the controller can run.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      # Required to maintain the CRD. The operator needs to do this, as it needs to enter e.g. it's
      # generated certificate in the conversion webhook.
      {{- if .Values.maintenance.customResourceDefinitions.maintain }}
      - create
      - patch
      {{- end }}
      # Required for startup condition
      - list
      - watch
  # Required to report reconciliation results and warnings back to the OpaCluster object.
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  # Primary CRD: watched by the controller and read during reconciliation.
  - apiGroups:
      - {{ include "opa-operator.name" . }}.stackable.tech
    resources:
      - {{ include "opa-operator.name" . }}clusters
    verbs:
      - get
      - list
      - watch
  # Status subresource: updated at the end of every reconciliation.
  - apiGroups:
      - {{ include "opa-operator.name" . }}.stackable.tech
    resources:
      - {{ include "opa-operator.name" . }}clusters/status
    verbs:
      - patch
